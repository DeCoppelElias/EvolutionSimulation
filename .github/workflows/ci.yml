name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the app actually runs, so it is checked too.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Check the docs with groundwork's checker at a pinned version
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/DeCoppelElias/groundwork/v0.1.0/scripts/docs_check.py -o "$RUNNER_TEMP/docs_check.py"
          python "$RUNNER_TEMP/docs_check.py"

      - name: Test the tools
        shell: bash
        run: python tools/test_compare.py && python tools/test_ancestor_competition.py

      - name: Build, check formatting and run tests
        # bash on both runners, so ./mvnw is the same command everywhere.
        shell: bash
        run: ./mvnw -B verify
